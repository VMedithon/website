<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (!t) t = "dark";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#071018" : "#f5f8f7");
      })();
    </script>
    <meta name="description" content="VMEDITHON 3.0 — Technology for a Healthier Tomorrow. 24-hour Hackathon + Buildathon at VIT Chennai, 15–16 September 2026." />
    <link rel="icon" type="image/png" href="/vmedithon-shorten.png" />
    <title>VMEDITHON 3.0</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
